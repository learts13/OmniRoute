name: Build OmniRoute 3.8.51

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64

    steps:
      - name: Checkout do fork
        uses: actions/checkout@v4

      - name: Baixar o código oficial da v3.8.51
        uses: actions/checkout@v4
        with:
          repository: diegosouzapw/OmniRoute
          ref: c1e30b7676975feb298b49eff6ff58923c04b89e
          path: source

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Entrar no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir e publicar imagem ${{ matrix.arch }}
        uses: docker/build-push-action@v6
        with:
          context: ./source
          file: ./source/Dockerfile
          target: runner-base
          platforms: ${{ matrix.platform }}
          build-args: |
            OMNIROUTE_BUILD_MEMORY_MB=8192
            OMNIROUTE_BUILD_WORKERS=2
          push: true
          tags: ghcr.io/learts13/omniroute:3.8.51-${{ matrix.arch }}

  publish-multiarch:
    name: Publicar tag multiarch 3.8.51
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Entrar no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Criar tag multiarch 3.8.51
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/learts13/omniroute:3.8.51 \
            ghcr.io/learts13/omniroute:3.8.51-amd64 \
            ghcr.io/learts13/omniroute:3.8.51-arm64
