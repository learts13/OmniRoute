name: Build OmniRoute 3.8.51

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do fork
        uses: actions/checkout@v4

      - name: Baixar o código oficial da v3.8.51
        uses: actions/checkout@v4
        with:
          repository: diegosouzapw/OmniRoute
          ref: c1e30b7676975feb298b49eff6ff58923c04b89e
          path: source

      - name: Aumentar heap do Node no build
        run: |
          grep -qE '^FROM .* AS builder' source/Dockerfile
          sed -i '/^FROM .* AS builder/a ENV NODE_OPTIONS=--max-old-space-size=8192' source/Dockerfile
          grep -n 'NODE_OPTIONS' source/Dockerfile

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Entrar no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir e publicar a imagem
        uses: docker/build-push-action@v6
        with:
          context: ./source
          file: ./source/Dockerfile
          target: runner-base
          platforms: linux/amd64
          push: true
          tags: ghcr.io/learts13/omniroute:3.8.51
