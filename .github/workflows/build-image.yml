name: Build OmniRoute ARM64

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  VERSION: "3.8.52"

jobs:
  build:
    name: Construir e publicar ARM64
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Baixar código oficial
        uses: actions/checkout@v4
        with:
          repository: cheaper-inference/OmniRoute
          ref: v${{ env.VERSION }}
          persist-credentials: false

      - name: Conferir versão do código
        run: |
          actual=$(node -p "require('./package.json').version")
          test "$actual" = "$VERSION"

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Entrar no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir e publicar imagem ARM64
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: runner-base
          platforms: linux/arm64
          build-args: |
            OMNIROUTE_BUILD_MEMORY_MB=8192
            OMNIROUTE_BUILD_WORKERS=2
          push: true
          tags: |
            ghcr.io/learts13/omniroute:${{ env.VERSION }}
            ghcr.io/learts13/omniroute:${{ env.VERSION }}-arm64

      - name: Conferir imagem publicada
        run: |
          docker buildx imagetools inspect \
            "ghcr.io/learts13/omniroute:${VERSION}"
